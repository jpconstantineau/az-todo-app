name: Task flow tests
on: [push]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    outputs:
      candidate_sha: ${{ steps.candidate.outputs.candidate_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Record tested candidate
        id: candidate
        shell: bash
        run: |
          candidate_sha="$(git rev-parse HEAD)"
          if [[ "$candidate_sha" != "$GITHUB_SHA" ]]; then
            echo "Checked out $candidate_sha instead of event SHA $GITHUB_SHA" >&2
            exit 1
          fi
          echo "candidate_sha=$candidate_sha" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: api/package-lock.json
      - run: npm ci
        working-directory: api
      - run: npx playwright install --with-deps chromium
        working-directory: api
      - run: npm test
        working-directory: api

  deploy_production:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    environment:
      name: production
      url: ${{ steps.builddeploy.outputs.static_web_app_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.test.outputs.candidate_sha }}
          submodules: true
          lfs: false
      - name: Verify deployment checkout
        id: deployment
        shell: bash
        env:
          CANDIDATE_SHA: ${{ needs.test.outputs.candidate_sha }}
        run: |
          deploy_sha="$(git rev-parse HEAD)"
          if [[ "$deploy_sha" != "$CANDIDATE_SHA" ]]; then
            echo "Checked out $deploy_sha instead of tested candidate $CANDIDATE_SHA" >&2
            exit 1
          fi
          echo "deploy_sha=$deploy_sha" >> "$GITHUB_OUTPUT"
      - name: Ensure candidate is still main
        uses: actions/github-script@v7
        env:
          CANDIDATE_SHA: ${{ needs.test.outputs.candidate_sha }}
        with:
          script: |
            const { data: reference } = await github.rest.git.getRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: 'heads/main'
            });
            if (reference.object.sha !== process.env.CANDIDATE_SHA) {
              core.setFailed(`Candidate ${process.env.CANDIDATE_SHA} is stale; main is ${reference.object.sha}`);
            }
      - name: Deploy tested candidate to production
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_PRODUCTION }}
          action: "upload"
          app_location: "/html"
          api_location: "/api"
          output_location: "/"
      - name: Record production evidence
        shell: bash
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          EVENT_SHA: ${{ github.sha }}
          TEST_RESULT: ${{ needs.test.result }}
          CANDIDATE_SHA: ${{ needs.test.outputs.candidate_sha }}
          DEPLOY_SHA: ${{ steps.deployment.outputs.deploy_sha }}
          ENVIRONMENT_URL: ${{ github.server_url }}/${{ github.repository }}/deployments/production
          AZURE_URL: ${{ steps.builddeploy.outputs.static_web_app_url }}
        run: |
          {
            echo "## Production deployment evidence"
            echo
            echo "| Evidence | Value |"
            echo "| --- | --- |"
            echo "| Test and deployment run | [${GITHUB_RUN_ID}](${RUN_URL}) |"
            echo "| Test result | ${TEST_RESULT} |"
            echo "| Event SHA | \`${EVENT_SHA}\` |"
            echo "| Tested candidate SHA | \`${CANDIDATE_SHA}\` |"
            echo "| Deployed checkout SHA | \`${DEPLOY_SHA}\` |"
            echo "| Production environment | [production](${ENVIRONMENT_URL}) |"
            echo "| Azure URL | [${AZURE_URL}](${AZURE_URL}) |"
          } >> "$GITHUB_STEP_SUMMARY"
