<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>To-Do</title>
    <link rel="stylesheet" href="/styles.css">
    <script src="https://cdn.jsdelivr.net/npm/htmx.org@1.9.12" defer></script>
    <script src="/app.js" defer></script>
  </head>
  <body>
    <div class="container">
      <p id="requestStatus" role="status" aria-live="polite"></p>
      <div id="requestError" role="alert" hidden></div>
      <div id="app" hx-get="/api/app" hx-trigger="load" hx-swap="innerHTML">
        <p>Loading app…</p>
        <button class="button" hx-get="/api/app" hx-target="#app">Retry loading</button>
        <noscript>Enable JavaScript to use this app.</noscript>
      </div>
    </div>
  </body>
</html>
